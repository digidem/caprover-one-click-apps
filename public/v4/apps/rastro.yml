captainVersion: 4

services:
    $$cap_appname-setup:
        image: communityfirst/rastro-pgtools:$$cap_tag-pg17
        restart: unless-stopped
        environment:
            RASTRO_PGTOOLS_MODE: setup-service
            RASTRO_SETUP_APP: $$cap_appname-setup
            RASTRO_PG_ADMIN_URL: '$$cap_pg_admin_url'
            RASTRO_DB: $$cap_pg_database
            RASTRO_PG_PASSWORD_INGEST: $$cap_pg_pw_ingest
            RASTRO_PG_PASSWORD_VIEWER: $$cap_pg_pw_viewer
            RASTRO_PG_PASSWORD_MAINT: $$cap_pg_pw_maint
            RASTRO_PG_PASSWORD_BACKUP: $$cap_pg_pw_backup
        volumes:
            - $$cap_appname-pgconn:/rastro-pgconn
        caproverExtra:
            notExposeAsWebApp: 'true'

    $$cap_appname-broker:
        image: communityfirst/rastro-broker:$$cap_tag
        restart: unless-stopped
        volumes:
            - $$cap_appname-broker-data:/mosquitto/data
            - $$cap_appname-pki:/mosquitto/public
        environment:
            RASTRO_MQTT_WEBSOCKETS: '1'
            RASTRO_MQTT_TOPIC_PREFIX: $$cap_topic_prefix
            RASTRO_MQTT_PASSWORD_GATEWAY: $$cap_mqtt_pw_gateway
            RASTRO_MQTT_PASSWORD_INGEST: $$cap_mqtt_pw_ingest
            RASTRO_MQTT_PASSWORD_OUTBOX: $$cap_mqtt_pw_outbox
            RASTRO_NATIVE_ROOT: $$cap_native_root
            RASTRO_NATIVE_NODES: '$$cap_native_nodes'
            RASTRO_NATIVE_SECRET: $$cap_native_secret
            RASTRO_BROKER_SANS: srv-captain--$$cap_appname-broker,$$cap_appname-broker,$$cap_appname-mqtt.$$cap_root_domain,$$cap_mqtt_extra_host
        caproverExtra:
            containerHttpPort: '9001'
            websocketSupport: 'true'

    $$cap_appname-ingest:
        image: communityfirst/rastro-ingest:$$cap_tag
        restart: unless-stopped
        depends_on:
            - $$cap_appname-setup
            - $$cap_appname-broker
        volumes:
            - $$cap_appname-pki:/rastro-pki
            - $$cap_appname-pgconn:/rastro-pgconn
        environment:
            RASTRO_MQTT_HOST: srv-captain--$$cap_appname-broker
            RASTRO_MQTT_PORT: '8883'
            RASTRO_MQTT_USERNAME: ingest
            RASTRO_MQTT_PASSWORD: $$cap_mqtt_pw_ingest
            RASTRO_MQTT_CA_CERT: /rastro-pki/ca.crt
            RASTRO_MQTT_CLIENT_ID: $$cap_appname-ingest-1
            RASTRO_MQTT_TOPIC_PREFIX: $$cap_topic_prefix
            RASTRO_PG_DB: $$cap_pg_database
            RASTRO_PG_PASSWORD: $$cap_pg_pw_ingest
            RASTRO_LOG_LEVEL: INFO
            RASTRO_NATIVE_ENABLED: '$$cap_native_enabled'
            RASTRO_NATIVE_ROOT: $$cap_native_root
            RASTRO_EVU_PSK_B64: '$$cap_evu_psk'
        caproverExtra:
            notExposeAsWebApp: 'true'

    $$cap_appname-chat:
        image: communityfirst/rastro-chat:$$cap_tag
        restart: unless-stopped
        depends_on:
            - $$cap_appname-setup
            - $$cap_appname-broker
        volumes:
            - $$cap_appname-pki:/rastro-pki
            - $$cap_appname-pgconn:/rastro-pgconn
        environment:
            RASTRO_MQTT_HOST: srv-captain--$$cap_appname-broker
            RASTRO_MQTT_PORT: '8883'
            RASTRO_MQTT_USERNAME: outbox
            RASTRO_MQTT_PASSWORD: $$cap_mqtt_pw_outbox
            RASTRO_MQTT_CA_CERT: /rastro-pki/ca.crt
            RASTRO_MQTT_CLIENT_ID: $$cap_appname-chat-1
            RASTRO_NATIVE_ROOT: $$cap_native_root
            RASTRO_NATIVE_NODES: '$$cap_native_nodes'
            RASTRO_EVU_PSK_B64: '$$cap_evu_psk'
            RASTRO_CHAT_ENABLED: '$$cap_native_enabled'
            RASTRO_PG_DB: $$cap_pg_database
            RASTRO_PG_PASSWORD: $$cap_pg_pw_ingest
            RASTRO_LOG_LEVEL: INFO
        caproverExtra:
            notExposeAsWebApp: 'true'

    $$cap_appname-api:
        image: communityfirst/rastro-api:$$cap_tag
        restart: unless-stopped
        depends_on:
            - $$cap_appname-setup
        volumes:
            - $$cap_appname-pgconn:/rastro-pgconn
        environment:
            RASTRO_API_AUTH: token
            RASTRO_API_TOKEN: $$cap_api_token
            RASTRO_API_HOSTS_LOCAIS: ''
            RASTRO_REQUIRE_HTTPS: '1'
            RASTRO_PG_DB: $$cap_pg_database
            RASTRO_PG_PASSWORD: $$cap_pg_pw_viewer
            RASTRO_LOG_LEVEL: INFO
        caproverExtra:
            notExposeAsWebApp: 'true'

    $$cap_appname:
        image: communityfirst/rastro-web:$$cap_tag
        restart: unless-stopped
        depends_on:
            - $$cap_appname-api
        volumes:
            - $$cap_appname-tiles:/srv/tiles
            - $$cap_appname-pki:/srv/pki
        environment:
            RASTRO_API_UPSTREAM: srv-captain--$$cap_appname-api:8080
            RASTRO_TITLE: $$cap_title
        caproverExtra:
            containerHttpPort: '80'

caproverOneClickApp:
    displayName: Rastro
    isOfficial: false
    description: Rastreamento de rádios Meshtastic em mapa próprio — broker MQTT com TLS automático, ingestão para o seu PostgreSQL, API e visualizador. Só a conexão de admin do Postgres (uma URL) é obrigatória.
    documentation: https://github.com/digidem/rastro
    instructions:
        start: |-
            Rastro recebe posições de rádios Meshtastic (via um gateway USB na base), guarda no PostgreSQL que você já tem no CapRover e mostra num mapa próprio. Nada vai para servidores públicos.

            O que esta instalação faz:
            1. Sobe o app "<nome>-setup", que cria no seu PostgreSQL um banco, um schema e 5 papéis DEDICADOS (prefixo = nome do banco). Não toca em nada fora deles, recusa nomes que já sejam de outra coisa, nunca apaga nada e usa timeouts para não atrapalhar outras cargas.
            2. Todas as senhas e o certificado TLS do broker são gerados automaticamente. O ÚNICO campo obrigatório é a conexão de admin do PostgreSQL, numa URL só: postgresql://usuario:senha@host:5432/banco (para Postgres externo/gerenciado, acrescente ?sslmode=require). No Postgres do CapRover: postgresql://postgres:<POSTGRES_PASSWORD>@srv-captain--postgres:5432/postgres, com o valor de POSTGRES_PASSWORD das variáveis de ambiente do app do Postgres. O usuário precisa ser superusuário ou ter CREATEROLE+CREATEDB. Host e porta ficam só neste app e são repassados ao ingest e à API por um volume; a URL (com a senha) fica só no app temporário -setup.
            3. Para instalar mais de um Rastro no mesmo servidor de Postgres, use um nome de banco diferente em cada um.

            ANTES de continuar: as imagens communityfirst/rastro-* na versão escolhida precisam existir no Docker Hub, e o DNS curinga (*.domínio-raiz) do CapRover precisa estar configurado. Nenhuma porta extra precisa ser aberta: o gateway fala MQTT sobre HTTPS (WebSocket, porta 443).
        end: |-
            Rastro está subindo. Faça, nesta ordem:
            1. Abra os logs do app "$$cap_appname-setup" e espere a linha "OK: PostgreSQL preparado". Se aparecer "ERRO:", corrija a variável indicada (por exemplo, a URL de admin) e use Save & Restart nesse app. Com o OK, APAGUE o app "$$cap_appname-setup": ele guarda a URL (com a senha) de admin do Postgres. Antes de apagar, anote (nas variáveis de ambiente dele) as senhas RASTRO_PG_PASSWORD_MAINT e RASTRO_PG_PASSWORD_BACKUP — servem para o backup e a retenção. Ao apagar, NÃO marque o volume "$$cap_appname-pgconn" para remoção: ingest e API leem a conexão dele.
            2. No app "$$cap_appname": ative HTTPS e "Force HTTPS". A API recusa acesso sem HTTPS e o visualizador não envia credenciais em HTTP.
            3. No app "$$cap_appname-broker": em HTTP Settings ative "Enable HTTPS" (o proxy do CapRover termina o TLS e repassa o WebSocket ao broker).
            4. No gateway (Raspberry Pi da base): RASTRO_MQTT_TRANSPORT=websockets, RASTRO_MQTT_HOST=$$cap_appname-broker.$$cap_root_domain, RASTRO_MQTT_PORT=443, RASTRO_MQTT_USERNAME=gateway, RASTRO_MQTT_PASSWORD = a senha do "gateway" (gerada; leia RASTRO_MQTT_PASSWORD_GATEWAY nas variáveis do app $$cap_appname-broker), RASTRO_MQTT_TOPIC_PREFIX igual ao prefixo escolhido e RASTRO_MQTT_CA_CERT vazio (o certificado é público, do Let's Encrypt). Alternativa direta (exige abrir 8883/TCP): porta 8883 com a CA de https://$$cap_appname.$$cap_root_domain/ca.crt.
            5. Guarde o token da API (variável RASTRO_API_TOKEN do app $$cap_appname-api): é ele que libera o mapa.
            6. Basemap: já vem pronto (OpenStreetMap servido pela API do próprio Rastro, com token; o navegador não fala com o OSM). Opcional: para um basemap offline próprio, copie basemap.pmtiles para o volume "$$cap_appname-tiles". Para desligar o OSM, defina RASTRO_OSM_TILES=0 no app "$$cap_appname-api".
            7. Retenção e backup não rodam aqui: agende rastro_retention.py e rastro_backup.sh (cron do servidor ou Windmill) com os papéis <banco>_maint e <banco>_backup.
            8. Ingest nativo + chat (opcional, desligado por padrão): preencha a chave do canal EVU, a raiz dos tópicos e os nós (!id=barco), mude "Ingest nativo + chat" para 1 e reimplante. No app "$$cap_appname-broker" abra a porta 8883 (TCP) no firewall do servidor e use um certificado TLS de uma CA reconhecida pelos rádios/app. A conta MQTT de cada nó é o próprio !id; a senha é derivada do segredo da variável RASTRO_NATIVE_SECRET do app "$$cap_appname-broker" (python3 scripts/rastro_node_credentials.py do repositório digidem/rastro). O chat do escritório aparece no mapa.
    variables:
        - id: $$cap_pg_admin_url
          label: Conexão de admin do PostgreSQL (OBRIGATÓRIA)
          validRegex: /^postgres(ql)?:\/\/[^'\s]+$/
          description: 'URL no formato postgresql://usuario:senha@host:5432/banco. O "banco" pode ser qualquer banco já existente ao qual o usuário consiga conectar (por exemplo, o da sua string de conexão atual). Para Postgres externo/gerenciado acrescente ?sslmode=require. O usuário precisa ser superusuário ou ter CREATEROLE+CREATEDB. Caracteres especiais na senha (@ : / % #) vão com percent-encoding (%40 %3A %2F %25 %23). No CapRover: postgresql://postgres:<POSTGRES_PASSWORD>@srv-captain--postgres:5432/postgres. É usada só pelo app temporário "-setup", que você apaga depois.'

        - id: $$cap_pg_database
          label: Nome do banco (e prefixo dos papéis)
          defaultValue: 'rastro'
          validRegex: /^[a-z][a-z0-9_]{0,30}$/
          description: Banco novo e dedicado. Se já houver outro Rastro neste Postgres, use um nome diferente.

        - id: $$cap_title
          label: Título do mapa
          defaultValue: 'Rastro'
          validRegex: /^[\wÀ-ÿ(][\w À-ÿ.()-]{0,29}$/

        - id: $$cap_mqtt_extra_host
          label: Domínio próprio extra para o MQTT (opcional — deixe vazio)
          defaultValue: ''
          validRegex: /^([A-Za-z0-9.-]{1,253})?$/
          description: O gateway já pode usar <nome-do-app>-mqtt.<domínio-raiz do CapRover> (coberto pelo DNS curinga). Só preencha se quiser um domínio seu além desse; ele também entra no certificado do broker.

        - id: $$cap_topic_prefix
          label: Prefixo dos tópicos MQTT
          defaultValue: 'rastro'
          validRegex: /^[a-z0-9_-]{1,32}$/
          description: Deve ser igual ao configurado no gateway.

        - id: $$cap_native_enabled
          label: Ingest nativo + chat (0 = desligado, 1 = ligado)
          defaultValue: '0'
          validRegex: /^[01]$/
          description: Deixe 0 até preencher a chave do canal EVU e os nós abaixo. Com 1, o ingest assina os tópicos nativos do firmware e o app "-chat" publica mensagens do escritório aos barcos.

        - id: $$cap_evu_psk
          label: Chave (PSK) do canal EVU em base64 (a mesma dos rádios)
          defaultValue: ''
          validRegex: /^[A-Za-z0-9+\/=]{0,64}$/
          description: Fica só nos apps "-ingest" e "-chat" (variável de ambiente). Nunca é registrada em log. Vazio = nativo desligado.

        - id: $$cap_native_root
          label: Raiz dos tópicos MQTT nativos do firmware
          defaultValue: 'univaja/mesh'
          validRegex: /^[a-z0-9_-]{1,32}(\/[a-z0-9_-]{1,32}){0,3}$/
          description: Deve ser igual à raiz configurada nos rádios (Root topic). O firmware publica em <raiz>/2/e/<canal>/<id-do-nó>.

        - id: $$cap_native_nodes
          label: Nós dos barcos no formato !id=barco, separados por vírgula
          defaultValue: ''
          validRegex: /^(![0-9a-f]{8}=[a-z0-9_-]{1,16}(,![0-9a-f]{8}=[a-z0-9_-]{1,16}){0,63})?$/
          description: 'Exemplo: !a1b2c3d4=barco1,!e5f6a7b8=barco2. Cada nó ganha uma conta MQTT própria e cada barco, um gateway virtual para o chat. A senha de cada nó é derivada do segredo abaixo — veja scripts/rastro_node_credentials.py no repositório.'

        - id: $$cap_native_secret
          label: Segredo que deriva as senhas MQTT dos nós (gerado automaticamente — anote)
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /^[A-Za-z0-9_.~-]{24,128}$/

        - id: $$cap_mqtt_pw_outbox
          label: Senha MQTT do usuário "outbox" (gerada automaticamente — não precisa mudar)
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /^[A-Za-z0-9_.~-]{24,128}$/

        - id: $$cap_tag
          label: Versão (tag das imagens Docker Hub communityfirst/rastro-*)
          defaultValue: '0.8.6'
          validRegex: /^[\w.-]{1,64}$/
          description: A mesma tag (versão publicada) vale para as imagens broker, ingest, chat, api, web e pgtools.

        - id: $$cap_mqtt_pw_gateway
          label: Senha MQTT do usuário "gateway" (gerada automaticamente — não precisa mudar; anote, o gateway usa)
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /^[A-Za-z0-9_.~-]{24,128}$/

        - id: $$cap_api_token
          label: Token de acesso ao mapa (gerado automaticamente — não precisa mudar; anote, libera o mapa)
          defaultValue: $$cap_gen_random_hex(48)
          validRegex: /^[A-Za-z0-9_.~-]{32,256}$/

        - id: $$cap_mqtt_pw_ingest
          label: Senha MQTT do usuário "ingest" (gerada automaticamente — não precisa mudar)
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /^[A-Za-z0-9_.~-]{24,128}$/

        - id: $$cap_pg_pw_ingest
          label: Senha do papel do ingest no Postgres (gerada automaticamente — não precisa mudar)
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /^[A-Za-z0-9_.~-]{24,128}$/

        - id: $$cap_pg_pw_viewer
          label: Senha do papel da API no Postgres (gerada automaticamente — não precisa mudar)
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /^[A-Za-z0-9_.~-]{24,128}$/

        - id: $$cap_pg_pw_maint
          label: Senha do papel de retenção no Postgres (gerada automaticamente — anote se for agendar a retenção)
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /^[A-Za-z0-9_.~-]{24,128}$/

        - id: $$cap_pg_pw_backup
          label: Senha do papel de backup no Postgres (gerada automaticamente — anote se for agendar o backup)
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /^[A-Za-z0-9_.~-]{24,128}$/
