server {
    listen 443 ssl;
    server_name localhost;

    # Self-signed, generated by tls_setup.sh. The client verifies nothing: what
    # is under test is the helper's behaviour behind TLS, not the certificate.
    ssl_certificate     /certs/localhost.crt;
    ssl_certificate_key /certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://superset:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The session cookie must survive the hop; the CSRF token rides in it.
        proxy_pass_header Set-Cookie;

        # SSE and long tool calls: no response buffering, no idle timeout below
        # the client's own.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
